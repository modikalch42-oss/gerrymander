<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>Gerrymander</title>
<meta name="description" content="A daily map-drawing puzzle: carve the island so the minority wins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#ff8a3d;--o-d:#d9621a;--o-t:#ffd9bb;--p:#8b5cf6;--p-d:#6236d1;--p-t:#ddd0ff;--ink:#22193a;--muted:#6d6480;--sand:#f7e3b0;--sand-d:#d4ad62;--card:#fffaf0;--laser:#59f3ff}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:linear-gradient(180deg,#c6ecff 0%,#e9f8ff 45%,#fff4e0 100%);color:var(--ink);font:16px/1.4 Fredoka,"Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1}
h1 small{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;vertical-align:middle;letter-spacing:0}
.place{margin:6px 0 0;font-weight:600;font-size:17px}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px}
.sub b{color:var(--ink)}
.ob{color:var(--o-d)!important}
.icon-btn{border:0;background:#fff;border-radius:12px;width:40px;height:40px;font-size:18px;box-shadow:0 2px 0 #0002;cursor:pointer;flex:none}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;box-shadow:0 2px 0 #0001;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:15px}
.pill.mid{justify-content:center;font-weight:400;color:var(--muted)}
.pill.mid b{color:var(--ink)}
.dot{width:14px;height:14px;border-radius:50%}
.dot.o{background:var(--o)}.dot.p{background:var(--p)}
.pop{animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

#sea{position:relative;width:100%;aspect-ratio:1;border-radius:28px;touch-action:none;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 50% 50%,#86def5 0 45%,#4bb6e6 68%,#2e8fd0 100%);box-shadow:inset 0 0 0 3px #ffffff55,0 8px 24px #1e5a8a33;overflow:hidden}
#sea::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 18px,#ffffff22 19px 21px,transparent 22px 40px);animation:tide 6s linear infinite;opacity:.6}
@keyframes tide{to{transform:scale(1.12)}}
#sea.shake{animation:shake .28s}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,3px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-3px)}}
#map,#stamps{position:absolute;inset:0;width:100%;height:100%}
#map{overflow:visible}
#stamps{pointer-events:none}

.surf{fill:none;stroke:#fff;stroke-width:26;opacity:.22;stroke-linejoin:round;animation:surf 3s ease-in-out infinite}
@keyframes surf{50%{stroke-width:36;opacity:.12}}
.cliff{fill:var(--sand-d)}
.beach{fill:var(--sand);stroke:var(--sand);stroke-width:16;stroke-linejoin:round}
.cell{stroke:none;transition:fill .25s}
.cell.l0{fill:#fff4d6}.cell.l1{fill:#fbeac2}.cell.l2{fill:#fff0cc}.cell.l3{fill:#f7e6bd}
.cell.d-o{fill:var(--o-t)}.cell.d-p{fill:var(--p-t)}
.cell.sel{fill:#fff}
.cell.won-o{fill:var(--o)}.cell.won-p{fill:var(--p)}
.precincts{fill:none;stroke:#7a5a2a;stroke-opacity:.28;stroke-width:2;stroke-dasharray:5 6;stroke-linecap:round}
.shoreline{fill:none;stroke:#b98f45;stroke-opacity:.5;stroke-width:2}

.dist{transform-box:view-box}
.band{fill:none;stroke-width:14;stroke-linejoin:round;stroke-linecap:round}
.dist.o .band{stroke:var(--o-d)}.dist.p .band{stroke:var(--p-d)}
.dist.snap{animation:band .55s cubic-bezier(.3,1.7,.45,1)}
@keyframes band{0%{transform:scale(1.12)}100%{transform:scale(1)}}
.dist.snap .band{animation:bandw .55s ease-out}
@keyframes bandw{0%{stroke-width:26}100%{stroke-width:14}}
.preview{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:12 9;stroke-linecap:round;animation:ants .6s linear infinite;filter:drop-shadow(0 0 3px #59f3ff)}
@keyframes ants{to{stroke-dashoffset:-21}}
.laser{fill:none;stroke:var(--laser);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
.laser-core{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.blob{pointer-events:none}
.fx{transform-box:fill-box;transform-origin:50% 100%}
.blob.squish .fx{animation:squish .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.18,.78)}65%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
.blob.flip .fx{transform-origin:50% 50%;animation:flip .42s ease-in-out}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.shadow{fill:#00000022}
.body-g{transform-box:fill-box;transform-origin:50% 100%;transition:transform .25s}
.blob.o .body{fill:var(--o);stroke:var(--o-d);stroke-width:3}.blob.p .body{fill:var(--p);stroke:var(--p-d);stroke-width:3}
.shine{fill:#fff;opacity:.45}
.eyes circle{fill:var(--ink)}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.mouth{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;display:none}
.m-flat{display:block}
.shades,.sweat{display:none}
.shades path{fill:#15112a}.shades .bridge{fill:none;stroke:#15112a;stroke-width:4}
.shades .glint{fill:#ffffff99}
.sweat{fill:#7fd3ff;stroke:#fff;stroke-width:2}
.cool .shades{display:block}.cool .eyes{display:none}
.cool .m-flat,.smug .m-flat,.nervous .m-flat,.sad .m-flat{display:none}
.cool .m-smile,.smug .m-smile{display:block}
.nervous .m-frown,.sad .m-frown{display:block}
.cool .body-g{animation:bop .5s ease-in-out infinite}
@keyframes bop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9%) scale(.95,1.05)}}
.smug .body-g{transform:scale(1.04)}
.nervous .body-g{transform:translateY(5%) scale(1.07,.88);animation:jitter .16s linear infinite}
@keyframes jitter{0%,100%{translate:0 0}50%{translate:1.5px 0}}
.nervous .sweat{display:block;animation:drip 1.1s ease-in infinite}
@keyframes drip{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(14px);opacity:0}}
.sad .body-g{transform:translateY(4%) scale(1.04,.92)}

.stamp{position:absolute;transform:translate(-50%,-50%) rotate(-9deg);padding:3px 9px;border:4px solid currentColor;border-radius:10px;background:#fffffff0;font-weight:700;font-size:clamp(12px,3.6vw,18px);white-space:nowrap;letter-spacing:.5px;animation:slam .34s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 4px 0 #0002}
.stamp.o{color:var(--o-d)}.stamp.p{color:var(--p-d)}
@keyframes slam{0%{transform:translate(-50%,-50%) rotate(-9deg) scale(2.8);opacity:0}55%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-9deg) scale(1);opacity:1}}

.controls{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px}
button{font:inherit}
.btn{border:0;border-radius:14px;padding:12px 10px;font-weight:600;font-size:16px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #0002;cursor:pointer;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0002}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}
.btn.primary:not(:disabled){animation:ready 1.6s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 3px 0 #000,0 0 0 5px #ff8a3d55}}
.help{margin:0;color:var(--muted);font-size:14px;text-align:center}
#result{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 4px 0 #0001,0 8px 24px #0001;text-align:center;animation:rise .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
#result h2{margin:0 0 4px;font-size:24px}
#result p{margin:4px 0;color:var(--muted)}
#result .row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
#result pre{font:18px/1.1 ui-monospace,monospace;margin:10px 0 0}
footer{display:flex;justify-content:center;gap:16px;font-size:14px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;transition:.25s;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (max-width:380px){h1{font-size:27px}.pill{padding:5px 9px;font-size:14px}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Gerrymander <small id="num">#1</small></h1>
      <p class="place">📍 <span id="place">…</span></p>
      <p class="sub">Carve the island into <b>5 districts of 5</b>. <b class="ob">Orange</b> is outnumbered <b>11–14</b>, so rig it: make Orange win <b>3</b>.</p>
    </div>
    <button class="icon-btn" id="mute" aria-label="Toggle sound">🔊</button>
  </header>

  <div class="hud">
    <div class="pill"><span class="dot o"></span><span id="oWins">0</span></div>
    <div class="pill mid"><span>Districts <b id="dCount">0</b>/5</span><span>·</span><span title="How rigged your map looks. Lower = tidier districts. Par is the tidiest winning map.">Suspicion <b id="susp">–</b> (par <b id="par">–</b>)</span></div>
    <div class="pill"><span id="pWins">0</span><span class="dot p"></span></div>
  </div>

  <div id="sea">
    <svg id="map" viewBox="0 0 500 500" aria-label="Island map">
      <defs>
        <clipPath id="isle"><path id="isleClip"/></clipPath>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <g id="maskDefs"></g>
      </defs>
      <path id="surf" class="surf"/>
      <path id="cliff" class="cliff" transform="translate(0 11)"/>
      <path id="beach" class="beach"/>
      <g clip-path="url(#isle)">
        <g id="cells"></g>
        <path id="precincts" class="precincts"/>
        <g id="distLayer"></g>
        <path id="preview" class="preview"/>
      </g>
      <path id="shoreline" class="shoreline"/>
      <g id="blobs"></g>
      <g id="liveLayer"></g>
    </svg>
    <div id="stamps"></div>
  </div>

  <p class="help">Drag across 5 neighbouring precincts to fence a district · tap a district to tear it down · 3 of 5 wins a seat</p>

  <div class="controls">
    <button class="btn" id="undo">Undo</button>
    <button class="btn" id="reset">Clear</button>
    <button class="btn primary" id="certify">Certify Election</button>
  </div>

  <section id="result" hidden></section>

  <footer>
    <button class="link" id="practice">New practice island</button>
    <button class="link" id="daily" hidden>Back to today's island</button>
  </footer>
</main>
<div id="toast" role="status"></div>

<script>
(() => {
/* ---------- utilities ---------- */
const C=25,S=5,ORANGE=11,W=500,G=4,NG=W/G,MINADJ=3,LO=0.004,HI=0.03;
const pc=m=>{let c=0;while(m){m&=m-1;c++}return c};
const bits=m=>{const a=[];for(let i=0;i<C;i++)if(m>>i&1)a.push(i);return a};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pip(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
const f1=v=>v.toFixed(1);
const polyD=P=>'M'+P.map(p=>f1(p[0])+' '+f1(p[1])).join('L')+'Z';

/* ---------- map generation: blobby island, 25 relaxed Voronoi precincts ---------- */
function genMap(rnd){
  const cx=250,cy=252,R=196,amp=[.06+rnd()*.06,.04+rnd()*.05,.02+rnd()*.03],ph=[0,0,0].map(()=>rnd()*7),K=[2,3,5],coast=[];
  for(let t=0;t<120;t++){const th=t/120*2*Math.PI;let r=R;for(let q=0;q<3;q++)r+=R*amp[q]*Math.sin(K[q]*th+ph[q]);r=Math.min(r,226);coast.push([cx+r*Math.cos(th),cy+r*Math.sin(th)*.93])}
  const land=new Uint8Array(NG*NG);let landN=0;
  for(let gy=0;gy<NG;gy++)for(let gx=0;gx<NG;gx++)if(pip(gx*G+G/2,gy*G+G/2,coast)){land[gy*NG+gx]=1;landN++}
  const sp=Math.sqrt(landN*G*G/C);let sites=[],D=sp*.8;
  while(sites.length<C){let tries=0;sites=[];while(sites.length<C&&tries<4000){tries++;const x=rnd()*W,y=rnd()*W;if(!land[Math.floor(y/G)*NG+Math.floor(x/G)])continue;if(sites.every(s=>Math.hypot(s[0]-x,s[1]-y)>=D))sites.push([x,y])}D*=.93}
  const own=new Int8Array(NG*NG).fill(-1);let cent,area;
  for(let it=0;it<5;it++){ // Lloyd relaxation over the land raster
    for(let g=0;g<NG*NG;g++)if(land[g]){const x=(g%NG)*G+G/2,y=Math.floor(g/NG)*G+G/2;let b=0,bd=1e9;for(let i=0;i<C;i++){const d=(sites[i][0]-x)**2+(sites[i][1]-y)**2;if(d<bd){bd=d;b=i}}own[g]=b}
    cent=sites.map(()=>[0,0]);area=new Array(C).fill(0);
    for(let g=0;g<NG*NG;g++)if(land[g]){const i=own[g];cent[i][0]+=(g%NG)*G+G/2;cent[i][1]+=Math.floor(g/NG)*G+G/2;area[i]++}
    cent=cent.map((c,i)=>[c[0]/area[i],c[1]/area[i]]);if(it<4)sites=cent.map(c=>c.slice())}
  const sh=Array.from({length:C},()=>new Array(C).fill(0));
  for(let gy=0;gy<NG;gy++)for(let gx=0;gx<NG;gx++){const g=gy*NG+gx;if(!land[g])continue;const a=own[g];
    if(gx<NG-1&&land[g+1]&&own[g+1]!==a){sh[a][own[g+1]]++;sh[own[g+1]][a]++}
    if(gy<NG-1&&land[g+NG]&&own[g+NG]!==a){sh[a][own[g+NG]]++;sh[own[g+NG]][a]++}}
  const NB=sh.map(r=>r.map((v,j)=>v>=MINADJ?j:-1).filter(j=>j>=0));
  // exact Voronoi polygons (clipped half-planes), each edge tagged with the neighbour that made it
  const polys=sites.map((s,i)=>{let P=[[-30,-30,-1],[530,-30,-1],[530,530,-1],[-30,530,-1]];
    for(let j=0;j<C;j++){if(j===i)continue;const nx=sites[j][0]-s[0],ny=sites[j][1]-s[1],mx=(s[0]+sites[j][0])/2,my=(s[1]+sites[j][1])/2,f=p=>(p[0]-mx)*nx+(p[1]-my)*ny,Q=[];
      for(let k=0;k<P.length;k++){const a=P[k],b=P[(k+1)%P.length],fa=f(a),fb=f(b);if(fa<=0)Q.push(a);if((fa<=0)!==(fb<=0)){const t=fa/(fa-fb);Q.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,fa<=0?j:a[2]])}}
      P=Q}return P});
  const ok=Math.min(...area)>=.45*landN/C;
  return{coast,sites,cent,NB,sp,polys,ok};
}
function enumerate(NB){
  const seen=new Set();
  for(let s=0;s<C;s++){let lv=new Set([1<<s]);for(let k=1;k<S;k++){const nx=new Set();for(const m of lv)for(const c of bits(m))for(const n of NB[c])if(!(m>>n&1))nx.add(m|1<<n);lv=nx}for(const m of lv)seen.add(m)}
  const PL=[...seen],byMin=Array.from({length:C},()=>[]);PL.forEach((m,k)=>{let i=0;while(!(m>>i&1))i++;byMin[i].push(k)});
  const FULL=(1<<C)-1;
  const okFree=used=>{let sn=used;for(let i=0;i<C;i++)if(!(sn>>i&1)){let st=[i],n=0;sn|=1<<i;while(st.length){const x=st.pop();n++;for(const y of NB[x])if(!(sn>>y&1)){sn|=1<<y;st.push(y)}}if(n%S)return false}return true};
  const out=[],cur=[];
  (function rec(used){if(used===FULL){for(const k of cur)out.push(k);return}let c=0;while(used>>c&1)c++;for(const k of byMin[c]){const m=PL[k];if(!(m&used)&&okFree(used|m)){cur.push(k);rec(used|m);cur.pop()}}})(0);
  return{PL,PARTS:Int32Array.from(out)};
}
const NAME_A=['Port','Isle of','Saint','Little','Great','North','Upper','Old','New','Lower'],NAME_B=['Wobble','Gloop','Squish','Jelly','Puddle','Plop','Bobble','Smoosh','Dribble','Mallow','Fizz','Blub','Wibble','Splodge','Goo'],NAME_C=['ton','wick','by','mouth','haven','ford','stead','combe','-on-Sea','sey'];
function makeLevel(seed){
  const rnd=mulberry32(seed);
  for(let attempt=0;attempt<12;attempt++){
    const M=genMap(rnd);if(!M.ok)continue;
    const E=enumerate(M.NB),nP=E.PARTS.length/S;if(nP<1500||nP>120000)continue;
    // suspicion: spread of each district around its centre, in precinct-spacing units (x5, integer)
    const SPR=E.PL.map(m=>{const cs=bits(m).map(i=>M.cent[i]);const mx=cs.reduce((a,p)=>a+p[0],0)/S,my=cs.reduce((a,p)=>a+p[1],0)/S;return Math.round(cs.reduce((a,p)=>a+(p[0]-mx)**2+(p[1]-my)**2,0)/M.sp**2*S)});
    const PS=new Int32Array(nP);for(let q=0;q<nP;q++){let s=0;for(let k=0;k<S;k++)s+=SPR[E.PARTS[q*S+k]];PS[q]=s}
    const wf=new Uint8Array(E.PL.length);let best=null;
    for(let t=0;t<160;t++){
      const cells=[...Array(C).keys()];for(let i=C-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
      let om=0;for(let i=0;i<ORANGE;i++)om|=1<<cells[i];
      for(let k=0;k<E.PL.length;k++)wf[k]=pc(E.PL[k]&om)>=3?1:0;
      let win=0,par=1e9;for(let q=0;q<nP;q++){const b=q*S;if(wf[E.PARTS[b]]+wf[E.PARTS[b+1]]+wf[E.PARTS[b+2]]+wf[E.PARTS[b+3]]+wf[E.PARTS[b+4]]>=3){win++;if(PS[q]<par)par=PS[q]}}
      const f=win/nP,cand={om,win,par};
      if(win>0&&f>=LO&&f<=HI){best=cand;break}
      if(win>0&&(!best||Math.abs(f-.015)<Math.abs(best.win/nP-.015)))best=cand}
    if(!best)continue;
    const pick=a=>a[Math.floor(rnd()*a.length)];let name=pick(NAME_A)+' '+pick(NAME_B)+pick(NAME_C);name=name.replace(' -','-');
    return{...M,...best,PL:E.PL,SPRm:new Map(E.PL.map((m,k)=>[m,SPR[k]])),total:nP,name};
  }
  return null;
}
const EPOCH=Date.UTC(2026,10,17);
function todayNum(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/864e5)+1}

/* ---------- audio (synthesised, no files) ---------- */
let ac=null,muted=false;
try{muted=localStorage.getItem('gm-muted')==='1'}catch(e){}
function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,d=.12,type='sine',v=.15,when=0,slide=0){const a=A();if(!a||muted)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}
function thud(v=.4,when=0){const a=A();if(!a||muted)return;const t=a.currentTime+when,len=a.sampleRate*.12,b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len)**3;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type='lowpass';fl.frequency.value=900;g.gain.value=v;s.connect(fl).connect(g).connect(a.destination);s.start(t);tone(90,.18,'sine',.35,when,.5)}
const sfx={
  tick:k=>tone(480+k*110,.07,'triangle',.13),
  snap:()=>{tone(240,.28,'sawtooth',.05,0,.55);tone(130,.22,'sine',.3,0,.6);tone(880,.05,'square',.04,.02)},
  fizzle:()=>tone(220,.22,'square',.04,0,.5),
  tear:()=>{tone(700,.12,'triangle',.08,0,.4);tone(300,.1,'sine',.1,.03,.5)},
  clack:k=>tone(1500+k*60,.03,'square',.035),
  chime:j=>{const f=523.25*Math.pow(2,j*3/12);tone(f,.55,'sine',.18);tone(f*2,.3,'triangle',.05)},
  win:()=>[0,4,7,12].forEach((s,i)=>tone(523.25*Math.pow(2,s/12),.35,'triangle',.14,i*.1)),
  lose:()=>[7,3,0].forEach((s,i)=>tone(330*Math.pow(2,s/12),.4,'sine',.12,i*.15))
};

/* ---------- elements ---------- */
const $=id=>document.getElementById(id);
const sea=$('sea'),svg=$('map'),cellsG=$('cells'),blobsG=$('blobs'),distLayer=$('distLayer'),maskDefs=$('maskDefs'),liveLayer=$('liveLayer'),stampsEl=$('stamps');
const BLOB=`<ellipse class="shadow" cx="50" cy="92" rx="34" ry="7"/><g class="body-g">
<path class="body" d="M50 12C77 12 89 33 89 57C89 80 73 91 50 91C27 91 11 80 11 57C11 33 23 12 50 12Z"/>
<ellipse class="shine" cx="34" cy="30" rx="11" ry="6" transform="rotate(-20 34 30)"/>
<g class="eyes"><circle cx="38" cy="50" r="6.5"/><circle cx="62" cy="50" r="6.5"/></g>
<g class="shades"><path d="M22 43h24v6a9 9 0 0 1-9 9h-6a9 9 0 0 1-9-9z"/><path d="M54 43h24v6a9 9 0 0 1-9 9h-6a9 9 0 0 1-9-9z"/><path class="bridge" d="M44 46h12"/><path class="glint" d="M27 46h6l-3 5h-4z"/></g>
<path class="mouth m-flat" d="M42 69h16"/><path class="mouth m-smile" d="M38 65Q50 78 62 65"/><path class="mouth m-frown" d="M40 73Q50 64 60 73"/>
<path class="sweat" d="M84 26q7 11 0 15q-7-4 0-15z"/></g>`;

/* ---------- state ---------- */
let L,COASTD,mode='daily',num=todayNum(),districts=[],owner=[],draw=null,trail=[],last=null,pendingRemove=-1,locked=false,attempts=1,blobs=[],cellEls=[];
const lean=m=>{const o=pc(m&L.om),p=pc(m)-o;return o>p?'o':p>o?'p':''};
const SPR=m=>L.SPRm.get(m)||0;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function load(newMode){
  mode=newMode;
  let seed=mode==='daily'?(Math.imul(num,2654435761)>>>0)^0x5eed:(Math.random()*2**32)>>>0;
  L=null;while(!L){L=makeLevel(seed);seed=(seed+0x9e3779b9)>>>0}
  attempts=1;
  $('num').textContent=mode==='daily'?'#'+num:'Practice';
  $('place').textContent=L.name;$('par').textContent=L.par;$('daily').hidden=mode==='daily';
  COASTD=polyD(L.coast);
  ['isleClip','surf','cliff','beach','shoreline'].forEach(id=>$(id).setAttribute('d',COASTD));
  cellsG.innerHTML=L.polys.map((P,i)=>`<path class="cell l${i%4}" d="${polyD(P)}"/>`).join('');
  let pd='';L.polys.forEach((P,i)=>P.forEach((a,k)=>{if(a[2]>i){const b=P[(k+1)%P.length];pd+=`M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}`}}));
  $('precincts').setAttribute('d',pd);
  const sc=L.sp*.7/100;
  blobsG.innerHTML=L.cent.map((c,i)=>`<g class="blob ${(L.om>>i&1)?'o':'p'}" transform="translate(${f1(c[0])} ${f1(c[1])})"><g transform="scale(${sc.toFixed(3)}) translate(-50 -58)"><g class="fx">${BLOB}</g></g></g>`).join('');
  cellEls=[...cellsG.children];blobs=[...blobsG.children];
  blobs.forEach(b=>b.querySelector('.eyes').style.animationDelay=(-Math.random()*4.5).toFixed(2)+'s');
  clearMap();
  const best=mode==='daily'&&store.get('gm2-best-'+num);
  if(best)showResult(best,true);
}
function clearMap(){districts=[];owner=new Array(C).fill(-1);draw=null;trail=[];locked=false;stampsEl.innerHTML='';$('result').hidden=true;
  cellEls.forEach(c=>c.classList.remove('won-o','won-p'));blobs.forEach(b=>b.classList.remove('flip'));refresh(true)}
function rebuildOwner(){owner.fill(-1);districts.forEach((d,j)=>bits(d.mask).forEach(i=>owner[i]=j))}

/* ---------- geometry ---------- */
function borderD(m){let d='';for(const i of bits(m)){const P=L.polys[i];for(let k=0;k<P.length;k++){const j=P[k][2];if(j<0||(m>>j&1))continue;const a=P[k],b=P[(k+1)%P.length];d+=`M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}`}}return d}
const unionD=m=>bits(m).map(i=>polyD(L.polys[i])).join('');
const centre=m=>{const cs=bits(m).map(i=>L.cent[i]);return[cs.reduce((a,p)=>a+p[0],0)/cs.length,cs.reduce((a,p)=>a+p[1],0)/cs.length]};
function pt(e){const r=svg.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*W]}
function nearest(p){let i1=-1,d1=1e9,d2=1e9;for(let i=0;i<C;i++){const d=Math.hypot(p[0]-L.sites[i][0],p[1]-L.sites[i][1]);if(d<d1){d2=d1;d1=d;i1=i}else if(d<d2)d2=d}return{i:i1,d1,d2}}
function cellAt(p,strict){const n=nearest(p);if(n.d1>L.sp*(strict?.75:.85))return-1;if(strict&&n.d2-n.d1<L.sp*.16)return-1;return n.i}

/* ---------- rendering ---------- */
function setMood(b,m){if(b.dataset.mood===m)return;b.dataset.mood=m;b.classList.remove('cool','smug','nervous','sad');if(m){b.classList.add(m);if(m==='cool')b.querySelector('.body-g').style.animationDelay=-(performance.now()%500)+'ms'}}
function refresh(districtsChanged){
  for(let i=0;i<C;i++){
    const mine=(L.om>>i&1)?'o':'p',inDraw=!!(draw&&draw.mask>>i&1),d=owner[i];
    const g=inDraw?draw.mask:d>=0?districts[d].mask:0,ln=g?lean(g):'';
    setMood(blobs[i],!ln?'':ln===mine?(mine==='o'?'cool':'smug'):(mine==='p'?'nervous':'sad'));
    const c=cellEls[i],dl=d>=0?lean(districts[d].mask):'';
    c.classList.toggle('sel',inDraw);c.classList.toggle('d-o',dl==='o');c.classList.toggle('d-p',dl==='p');
  }
  if(!locked){let ow=0,pw=0,s=0;for(const d of districts){lean(d.mask)==='o'?ow++:pw++;s+=SPR(d.mask)}
    $('oWins').textContent=ow;$('pWins').textContent=pw;$('susp').textContent=districts.length?s:'–'}
  $('dCount').textContent=districts.length;
  $('certify').disabled=districts.length<5||locked;$('undo').disabled=!districts.length||locked;$('reset').disabled=!districts.length||locked;
  if(districtsChanged){
    maskDefs.innerHTML=districts.map((d,j)=>`<mask id="mk${j}" maskUnits="userSpaceOnUse" x="-40" y="-40" width="580" height="580"><path fill="#fff" d="${unionD(d.mask)}"/></mask>`).join('');
    distLayer.innerHTML=districts.map((d,j)=>{const[cx,cy]=centre(d.mask);return`<g class="dist ${lean(d.mask)}${d.fresh?' snap':''}" style="transform-origin:${f1(cx)}px ${f1(cy)}px"><path class="band" mask="url(#mk${j})" d="${borderD(d.mask)}${COASTD}"/></g>`}).join('');
    districts.forEach(d=>d.fresh=false)}
  $('preview').setAttribute('d',draw?borderD(draw.mask):'');
  drawLive();
}
function drawLive(){
  let h='';
  if(trail.length>1){const p=trail.map(q=>q[0].toFixed(0)+','+q[1].toFixed(0)).join(' ');h=`<polyline class="laser" points="${p}"/><polyline class="laser-core" points="${p}"/>`}
  liveLayer.innerHTML=h;
}
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function retrigger(el,cls){el.classList.remove(cls);void el.getBoundingClientRect();el.classList.add(cls)}

/* ---------- drawing input ---------- */
function tryAdd(i){
  if(!draw||i<0||draw.mask>>i&1||owner[i]>=0)return;
  if(!L.NB[i].some(n=>draw.mask>>n&1))return;
  draw.cells.push(i);draw.mask|=1<<i;sfx.tick(draw.cells.length-1);
  if(navigator.vibrate)try{navigator.vibrate(6)}catch(e){}
  if(draw.cells.length===S)commit();else refresh(false);
}
function commit(){
  const m=draw.mask;districts.push({mask:m,fresh:true});draw=null;rebuildOwner();
  bits(m).forEach(i=>retrigger(blobs[i],'squish'));
  sfx.snap();refresh(true);bump($(lean(m)==='o'?'oWins':'pWins'));
}
function removeDistrict(j){districts.splice(j,1);rebuildOwner();sfx.tear();refresh(true)}

sea.addEventListener('pointerdown',e=>{
  if(locked)return;A();const p=pt(e),i=cellAt(p,false);if(i<0)return;
  try{sea.setPointerCapture(e.pointerId)}catch(_){}
  if(owner[i]>=0){pendingRemove=owner[i];return}
  draw={cells:[i],mask:1<<i};last=p;trail=[p];sfx.tick(0);refresh(false);
});
sea.addEventListener('pointermove',e=>{
  if(!draw&&!trail.length)return;const p=pt(e);
  if(draw&&last){const steps=Math.max(1,Math.ceil(Math.hypot(p[0]-last[0],p[1]-last[1])/8));
    for(let s=1;s<=steps&&draw;s++)tryAdd(cellAt([last[0]+(p[0]-last[0])*s/steps,last[1]+(p[1]-last[1])*s/steps],true))}
  last=p;if(trail.length){trail.push(p);if(trail.length>18)trail.shift()}drawLive();
});
function endPointer(){
  if(pendingRemove>=0){removeDistrict(pendingRemove);pendingRemove=-1;return}
  if(draw){draw=null;sfx.fizzle();refresh(false)}
  trail=[];last=null;drawLive();
}
sea.addEventListener('pointerup',endPointer);sea.addEventListener('pointercancel',endPointer);

/* ---------- certification ---------- */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function mosaic(){
  const xs=L.coast.map(p=>p[0]),ys=L.coast.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const cols=8,rows=Math.max(5,Math.round(cols*(y1-y0)/(x1-x0))),out=[];
  for(let r=0;r<rows;r++){let row='';for(let c=0;c<cols;c++){const x=x0+(c+.5)*(x1-x0)/cols,y=y0+(r+.5)*(y1-y0)/rows;
    if(!pip(x,y,L.coast)){row+='🟦';continue}row+=lean(districts[owner[nearest([x,y]).i]].mask)==='o'?'🟧':'🟪'}out.push(row)}
  return out;
}
async function certify(){
  if(districts.length<5||locked)return;locked=true;refresh(false);
  let ow=0,pw=0;$('oWins').textContent=0;$('pWins').textContent=0;
  const order=districts.map(d=>({d,cs:bits(d.mask).sort((a,b)=>L.cent[a][0]-L.cent[b][0]),c:centre(d.mask)})).sort((a,b)=>a.c[0]-b.c[0]);
  for(let j=0;j<order.length;j++){
    const{d,cs,c}=order[j],w=lean(d.mask);
    cs.forEach((i,k)=>setTimeout(()=>{retrigger(blobs[i],'flip');sfx.clack(k);setTimeout(()=>cellEls[i].classList.add('won-'+w),210)},k*65));
    await wait(cs.length*65+260);
    const st=document.createElement('div');st.className='stamp '+w;st.textContent=(w==='o'?'ORANGE':'PURPLE')+' +1';
    st.style.left=(c[0]/W*100)+'%';st.style.top=(c[1]/W*100)+'%';stampsEl.appendChild(st);
    thud();sfx.chime(j);retrigger(sea,'shake');
    if(w==='o'){ow++;$('oWins').textContent=ow;bump($('oWins'))}else{pw++;$('pWins').textContent=pw;bump($('pWins'))}
    await wait(420);
  }
  await wait(250);
  const susp=districts.reduce((a,d)=>a+SPR(d.mask),0);
  const res={ow,pw,susp,par:L.par,attempts,mosaic:mosaic(),name:L.name};
  if(mode==='daily'&&ow>=3){const best=store.get('gm2-best-'+num);if(!best||susp<best.susp)store.set('gm2-best-'+num,res)}
  showResult(res,false);
}
function grade(r){if(r.ow<3)return['Purple holds the island','The voters got their way. Unacceptable.'];
  if(r.susp<=r.par)return['Flawless rig','Tidiest winning map possible. The courts suspect nothing.'];
  if(r.susp<=r.par+12)return['Certified!','A little lumpy, but it should survive a court challenge.'];
  return['Certified… barely','Those districts look like a salamander. Journalists are circling.']}
function shareText(r){const head=mode==='daily'?`Gerrymander #${num} · ${r.name}`:`Gerrymander Practice · ${r.name}`;
  return `${head}\n${r.ow}-${r.pw} ${r.ow>=3?'Victory':'Defeat'} | Suspicion ${r.susp} (par ${r.par})${r.attempts>1?` | ${r.attempts} tries`:''}\n${r.mosaic.join('\n')}`}
function showResult(r,restored){
  const[h,p]=grade(r),el=$('result');
  el.innerHTML=`<h2>${restored?"Today's best: ":''}${h}</h2><p>${p}</p><p><b>${r.ow}–${r.pw}</b> · Suspicion <b>${r.susp}</b> (par ${r.par})${r.attempts>1?` · ${r.attempts} tries`:''}</p><pre>${r.mosaic.join('\n')}</pre>
  <div class="row"><button class="btn primary" id="share">Share result</button><button class="btn" id="again">${r.ow>=3?'Beat my suspicion':'Redraw'}</button></div>`;
  el.hidden=false;
  if(!restored)(r.ow>=3?sfx.win:sfx.lose)();
  $('share').onclick=()=>share(shareText(r));
  $('again').onclick=()=>{if(!restored)attempts++;clearMap();sea.scrollIntoView({behavior:'smooth',block:'center'})};
  if(!restored)el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function share(text){
  try{if(navigator.share&&matchMedia('(pointer:coarse)').matches){await navigator.share({text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('Copied to clipboard')}
  catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(_){toast('Could not copy')}ta.remove()}
}
let tt;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- buttons ---------- */
$('certify').onclick=certify;
$('undo').onclick=()=>{if(districts.length)removeDistrict(districts.length-1)};
$('reset').onclick=()=>{if(districts.length){sfx.tear();clearMap()}};
$('practice').onclick=()=>load('practice');
$('daily').onclick=()=>load('daily');
const mb=$('mute');mb.textContent=muted?'🔇':'🔊';
mb.onclick=()=>{muted=!muted;mb.textContent=muted?'🔇':'🔊';try{localStorage.setItem('gm-muted',muted?'1':'0')}catch(e){}};

load('daily');
window.__gm={get L(){return L},get districts(){return districts},enumerate,bits,lean};
})();
</script>
